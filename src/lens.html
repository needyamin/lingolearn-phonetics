<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <title>LingoLearn Lens</title>
    <style>
        :root, :root[data-theme="light"] {
            --ll-bg: #ffffff;
            --ll-fg: #1f2430;
            --ll-muted: #6a7188;
            --ll-border: rgba(15, 23, 42, 0.10);
            --ll-accent: #6a5cf5;
            --ll-accent-weak: #efedfe;
            --ll-chip: #f3f4fa;
            --ll-danger: #b3261e;
        }
        :root[data-theme="dark"] {
            --ll-bg: #1b1e29;
            --ll-fg: #e9ebf4;
            --ll-muted: #9aa2bb;
            --ll-border: rgba(255, 255, 255, 0.10);
            --ll-accent: #a08fff;
            --ll-accent-weak: #2b2847;
            --ll-chip: #262a38;
            --ll-danger: #ff9089;
        }
        @media (prefers-color-scheme: dark) {
            :root[data-theme="auto"] {
                --ll-bg: #1b1e29;
                --ll-fg: #e9ebf4;
                --ll-muted: #9aa2bb;
                --ll-border: rgba(255, 255, 255, 0.10);
                --ll-accent: #a08fff;
                --ll-accent-weak: #2b2847;
                --ll-chip: #262a38;
                --ll-danger: #ff9089;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background: transparent; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", "Nirmala UI", Vrinda, sans-serif;
            font-size: 14px;
            line-height: 1.45;
            color: var(--ll-fg);
            padding: 8px;
        }
        .card {
            background: var(--ll-bg);
            color: var(--ll-fg);
            border: 1px solid var(--ll-border);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(2, 6, 23, 0.08), 0 16px 40px rgba(2, 6, 23, 0.16);
            overflow: hidden;
            user-select: none;
        }
        .head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 7px 7px 12px;
            border-bottom: 1px solid var(--ll-border);
        }
        .lang {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--ll-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tools { display: flex; gap: 2px; flex: none; }
        .btn {
            appearance: none;
            border: 0;
            background: transparent;
            color: var(--ll-muted);
            width: 26px;
            height: 26px;
            border-radius: 7px;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: background-color 0.12s, color 0.12s;
        }
        .btn:hover { background: var(--ll-chip); color: var(--ll-fg); }
        .btn svg { width: 15px; height: 15px; fill: currentColor; }
        .btn.speaking { color: var(--ll-accent); background: var(--ll-accent-weak); }
        .btn.speaking svg { animation: pulse 1.1s ease-in-out infinite; }
        @keyframes pulse { 50% { transform: scale(1.18); } }
        .body { padding: 10px 12px 12px; }
        .sel {
            font-size: 12px;
            color: var(--ll-muted);
            margin-bottom: 8px;
            word-break: break-word;
            max-height: 3.6em;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .meaning { font-size: 16px; line-height: 1.55; word-break: break-word; }
        .ipa { margin-top: 5px; font-size: 12px; color: var(--ll-muted); }
        .note { margin-top: 6px; font-size: 11.5px; color: var(--ll-muted); }
        .error { color: var(--ll-danger); font-size: 13px; word-break: break-word; }
        .dict { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
        .dict-item { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .pos { flex: none; font-size: 11.5px; font-style: italic; color: var(--ll-muted); }
        .terms { display: flex; flex-wrap: wrap; gap: 4px; }
        .term { background: var(--ll-chip); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
        .foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 4px 12px 6px;
            border-top: 1px solid var(--ll-border);
        }
        .gt {
            appearance: none;
            background: transparent;
            border: 0;
            padding: 2px 3px;
            color: var(--ll-muted);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-family: inherit;
        }
        .gt svg { width: 13px; height: 13px; fill: currentColor; }
        .gt:hover { color: var(--ll-accent); }
        .brand {
            color: var(--ll-muted);
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .brand:hover { color: var(--ll-accent); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="card">
        <header class="head">
            <span class="lang" id="ll-lang">English &rarr; Bangla</span>
            <span class="tools">
                <button class="btn" id="ll-speak" type="button" title="Pronounce">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10H3z"/><path d="M16.5 12c0-1.8-1-3.4-2.5-4.1v8.2c1.5-.7 2.5-2.3 2.5-4.1z"/><path d="M14 3.1v2.1c3 .9 5.2 3.6 5.2 6.8s-2.2 5.9-5.2 6.8v2.1c4.1-1 7.2-4.6 7.2-8.9S18.1 4.1 14 3.1z"/></svg>
                </button>
                <button class="btn" id="ll-close" type="button" title="Close (Esc)">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
                </button>
            </span>
        </header>
        <div class="body">
            <div class="sel" id="ll-selection"></div>
            <div class="meaning" id="ll-meaning" dir="auto"></div>
            <div class="ipa hidden" id="ll-ipa"></div>
            <div class="note hidden" id="ll-note"></div>
            <div class="error hidden" id="ll-error"></div>
            <div class="dict hidden" id="ll-dict"></div>
        </div>
        <footer class="foot">
            <button class="gt" id="ll-gt" type="button" title="Open in Google Translate">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.4 4.3H13V2L21.6 6.5 13 11V8.7H2.4z"/><path d="M21.6 15.3H11V13L2.4 17.5 11 22v-2.3h10.6z"/></svg>
                <span>Google Translate</span>
            </button>
            <a class="brand" href="#" id="ll-brand">by ANSNEW TECH.</a>
        </footer>
    </div>
    <script src="lens.js"></script>
</body>
</html>
